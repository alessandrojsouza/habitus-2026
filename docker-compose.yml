services:
  db:
    image: postgres:16-alpine
    container_name: habitus_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: habitus
      POSTGRES_USER: habitus
      POSTGRES_PASSWORD: habituspassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habitus -d habitus"]
      interval: 3s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: habitus_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./devadmin/media:/usr/src/python/app/devadmin/media
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgres://habitus:habituspassword@db:5432/habitus
      - SECRET_KEY=ynn0i5jGFDmXdJOM7I3IFp1w1iSeZQPoPgFpdguDAUw4uyxhFZ61w3ko_MjaYA6GLGU
      - DEBUG=True
      - ALLOWED_HOSTS=*
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: